name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Run the authenticated live tests against Logos (needs the logos-live environment)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    # SDK only. Core is never installed here: a unit test that needs it is a
    # boundary leak, and this job is where that shows.
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Core is absent
        run: uv run python -c "import importlib.util as u, sys; sys.exit(u.find_spec('research_engine') is not None)"
      - name: Unit tests
        run: uv run pytest tests/unit -q

  artifacts:
    # Builds the wheel and sdist, inspects them, installs them into a clean
    # environment outside the checkout, and runs discovery and the unit suite
    # against the installed copy.
    name: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build plugin
        run: uv build --out-dir dist
      - name: Inspect artifacts
        run: uv run --no-project --with pyyaml python scripts/check_dist.py dist
      - name: twine check --strict
        run: uvx --from twine twine check --strict dist/*
      - name: Clean install outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl \
            "pytest>=8,<9" "pytest-asyncio>=0.23,<1" "pyyaml>=6,<7"
      - name: Discover and load from site-packages
        working-directory: ${{ runner.temp }}
        run: env -u PYTHONPATH "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed.py"
      - name: Console scripts start without core
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/smoke/bin/logos-login" --help
          "$RUNNER_TEMP/smoke/bin/logos-diagnose" --help
      - name: Unit suite against the installed wheel
        run: |
          mkdir -p "$RUNNER_TEMP/suite"
          cp -r tests "$RUNNER_TEMP/suite/tests"
          printf '[pytest]\nasyncio_mode = auto\nmarkers =\n    unit\n    integration\n    live\n' > "$RUNNER_TEMP/suite/pytest.ini"
          cd "$RUNNER_TEMP/suite"
          env -u PYTHONPATH "$RUNNER_TEMP/smoke/bin/python" -m pytest tests/unit -q -p no:cacheprovider
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  migrations:
    # The plugin's own schema lifecycle, on a disposable database. Needs no core.
    name: plugin migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LOGOS_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migration tests
        run: uv run pytest tests/integration/test_plugin_migrations.py -q

  core-integration:
    # Against the exact core release this plugin declares (`core_api` in
    # logos/plugin.yaml). Runs once the repository variable RE_CORE_SPEC is set
    # to something pip can install — `marginalia-ai==0.6.0` once core is
    # published, or `marginalia-ai @ git+https://github.com/John-Cusack/MarginaliaAI@<sha>#subdirectory=packages/core`
    # before then. A job that cannot install core proves nothing, so it is
    # skipped rather than failed while the variable is unset.
    name: core integration (${{ vars.RE_CORE_SPEC }})
    if: ${{ vars.RE_CORE_SPEC != '' }}
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RE_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/re_core
      LOGOS_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RE_DATA_DIR: ${{ runner.temp }}/re-data
      # The engine builds its whole container for any `plugin` command, so it
      # needs an embedding backend configured. Nothing is embedded by these
      # steps; the suite starts its own fake embed server where it needs one.
      RE_EMBEDDING_PROVIDER: remote_api
      RE_RERANKER_PROVIDER: none
      RE_INFERENCE_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install exact core and this plugin's wheel
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/core/bin/python" -m pip install \
            "${{ vars.RE_CORE_SPEC }}" dist/*.whl \
            "pytest>=8,<9" "pytest-asyncio>=0.23,<1" "pyyaml>=6,<7"
      - name: Core's schema
        run: |
          bin="$RUNNER_TEMP/core/bin"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -c 'CREATE DATABASE re_core'
          ini="$("$bin/python" -c 'from importlib.resources import files; print(files("research_engine").joinpath("adapters/storage/postgres/migrations/alembic.ini"))')"
          "$bin/alembic" -c "$ini" upgrade head
      - name: Core discovers, enables, migrates and loads the plugin
        working-directory: ${{ runner.temp }}
        run: |
          bin="$RUNNER_TEMP/core/bin"
          "$bin/research-engine" plugin list
          "$bin/research-engine" plugin audit logos
          "$bin/research-engine" plugin enable logos --yes
          "$bin/research-engine" plugin migrate logos --yes
          "$bin/research-engine" plugin doctor logos
      - name: Integration tests against the installed wheel
        run: |
          mkdir -p "$RUNNER_TEMP/suite"
          cp -r tests "$RUNNER_TEMP/suite/tests"
          printf '[pytest]\nasyncio_mode = auto\nmarkers =\n    unit\n    integration\n    live\n' > "$RUNNER_TEMP/suite/pytest.ini"
          cd "$RUNNER_TEMP/suite"
          env -u PYTHONPATH "$RUNNER_TEMP/core/bin/python" -m pytest tests/integration -q -p no:cacheprovider -m "not live"

  live:
    # Opt-in only: real Logos API calls with a real, licensed account.
    name: live (authenticated)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: logos-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - name: Seed the session
        env:
          LOGOS_COOKIES_JSON: ${{ secrets.LOGOS_COOKIES_JSON }}
        run: |
          export RE_DATA_DIR="$RUNNER_TEMP/re-data"
          install -d -m 700 "$RE_DATA_DIR/plugin-data/logos"
          umask 177
          printf '%s' "$LOGOS_COOKIES_JSON" > "$RE_DATA_DIR/plugin-data/logos/cookies.json"
          echo "RE_DATA_DIR=$RE_DATA_DIR" >> "$GITHUB_ENV"
      - name: Live tests
        env:
          LOGOS_LIVE: "1"
        run: uv run pytest tests/integration -q -m live
