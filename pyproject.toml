[project]
name = "marginalia-ai-plugin-logos"
version = "0.2.1"
description = "Logos Bible Software plugin for Research Engine: API tools, verse-boundary chunking, resumable book ingestion"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "John Cusack" }]
keywords = [
    "marginalia-ai",
    "marginalia-ai-plugin",
    "logos",
    "faithlife",
    "bible",
    "biblical-studies",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Religion",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "marginalia-ai-sdk>=0.6.1,<0.7",
    "httpx>=0.27,<1",
    "asyncpg>=0.29,<1",
    "pydantic>=2.5,<3",
    "structlog>=24.1,<26",
    # `logos.filters.ScriptureRefRangeFilter` builds its clause with SQLAlchemy.
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
# Browser login and silent session renewal. The Chromium binary is a separate,
# explicit step: `python -m playwright install chromium`.
auth = [
    "playwright>=1.40,<2",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/marginalia-plugin-logos"
Source = "https://github.com/John-Cusack/marginalia-plugin-logos"
Issues = "https://github.com/John-Cusack/marginalia-plugin-logos/issues"
Changelog = "https://github.com/John-Cusack/marginalia-plugin-logos/blob/main/CHANGELOG.md"

[project.scripts]
logos-login = "logos.cli.login:main"
logos-diagnose = "logos.cli.diagnose:main"

[project.entry-points."research_engine.plugins"]
logos = "logos"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logos"]

[tool.hatch.build.targets.sdist]
# An allowlist, so nothing local — cookies, profiles, checkpoints, `.env`,
# caches, and developer-only files — can reach an artifact by being forgotten.
only-include = ["logos", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no I/O)",
    "integration: Integration tests (real Postgres; skipped without one)",
    "live: Hits the real Logos API with stored credentials; opt in with LOGOS_LIVE=1",
]
